<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Birthday Game Night</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      background:
        repeating-linear-gradient(
          -45deg,
          #000000 0px,
          #000000 18px,
          #111111 18px,
          #111111 36px
        );
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 25px;
    }

    .app {
      width: 100%;
      max-width: 850px;
      background: #000;
      border: 3px solid #ff4fa3;
      border-radius: 25px;
      padding: 25px;
      box-shadow:
        0 0 20px rgba(255, 79, 163, 0.6),
        0 0 50px rgba(255, 79, 163, 0.25);
      text-align: center;
    }

    /* -------------------------
       BANNER
    ------------------------- */

    .banner {
      width: 100%;
      min-height: 150px;
      border-radius: 18px;
      margin-bottom: 25px;

      background:
        repeating-linear-gradient(
          -45deg,
          #ff4fa3 0px,
          #ff4fa3 15px,
          #ff78b9 15px,
          #ff78b9 30px
        );

      display: flex;
      justify-content: center;
      align-items: center;

      border: 2px solid white;
      overflow: hidden;
      position: relative;
    }

    .banner-text {
      position: relative;
      z-index: 2;
      color: white;
      text-shadow:
        3px 3px 0 #000,
        0 0 10px rgba(0,0,0,0.6);
    }

    .banner-text h1 {
      font-family: Georgia, serif;
      font-size: clamp(2rem, 7vw, 4rem);
      letter-spacing: 3px;
      text-transform: uppercase;
    }

    .banner-text p {
      font-size: 1rem;
      letter-spacing: 4px;
      font-weight: bold;
      margin-top: 5px;
    }

    /* -------------------------
       WHEEL AREA
    ------------------------- */

    .wheel-container {
      position: relative;
      width: min(75vw, 600px);
      aspect-ratio: 1 / 1;
      margin: 20px auto 30px;
    }

    canvas {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      box-shadow:
        0 0 0 8px #000,
        0 0 0 11px #ff4fa3,
        0 0 30px rgba(255, 79, 163, 0.7);
    }

    /* Pointer */

    .pointer {
      position: absolute;
      top: -10px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;

      width: 0;
      height: 0;

      border-left: 25px solid transparent;
      border-right: 25px solid transparent;
      border-top: 55px solid white;

      filter:
        drop-shadow(0 0 3px #000)
        drop-shadow(0 0 8px #ff4fa3);
    }

    /* -------------------------
       SPIN BUTTON
    ------------------------- */

    #spinButton {
      border: none;
      background: linear-gradient(
        135deg,
        #ff4fa3,
        #ff86bd
      );
      color: white;

      font-size: 1.4rem;
      font-weight: 900;

      padding: 16px 50px;
      border-radius: 50px;

      cursor: pointer;

      text-transform: uppercase;
      letter-spacing: 2px;

      box-shadow:
        0 5px 0 #a51f61,
        0 0 20px rgba(255, 79, 163, 0.7);

      transition: all 0.15s ease;
    }

    #spinButton:hover {
      transform: translateY(-2px);
      box-shadow:
        0 7px 0 #a51f61,
        0 0 30px rgba(255, 79, 163, 0.9);
    }

    #spinButton:active {
      transform: translateY(4px);
      box-shadow:
        0 2px 0 #a51f61;
    }

    #spinButton:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    /* -------------------------
       RESULT
    ------------------------- */

    .result-box {
      margin-top: 30px;
      padding: 20px;

      background: #111;
      border: 2px solid #ff4fa3;
      border-radius: 18px;

      min-height: 100px;

      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    .result-label {
      color: #ff78b9;
      font-size: 0.9rem;
      text-transform: uppercase;
      letter-spacing: 3px;
      font-weight: bold;
      margin-bottom: 8px;
    }

    #result {
      color: white;
      font-family: Georgia, serif;
      font-size: clamp(1.5rem, 5vw, 2.5rem);
      font-weight: bold;
    }

    /* -------------------------
       FOOTER
    ------------------------- */

    .footer {
      margin-top: 20px;
      color: #aaa;
      font-size: 0.8rem;
      letter-spacing: 1px;
    }

    /* -------------------------
       MOBILE
    ------------------------- */

    @media (max-width: 600px) {

      body {
        padding: 10px;
      }

      .app {
        padding: 15px;
        border-radius: 18px;
      }

      .banner {
        min-height: 120px;
      }

      .wheel-container {
        width: 88vw;
      }

      #spinButton {
        width: 90%;
        font-size: 1.1rem;
      }
    }
  </style>
</head>

<body>

  <div class="app">

    <!-- =========================
         BANNER
    ========================== -->

    <div class="banner">

      <!--
        OPTIONAL:
        Replace this entire banner-text section
        with your own image if you want.

        Example:

        <img src="your-banner.jpg"
             alt="Birthday Banner"
             style="width:100%; height:100%; object-fit:cover;">
      -->

      <div class="banner-text">
        <h1>25 & Fabulous</h1>
        <p>GAME NIGHT</p>
      </div>

    </div>


    <!-- =========================
         WHEEL
    ========================== -->

    <div class="wheel-container">

      <div class="pointer"></div>

      <canvas id="wheel" width="600" height="600"></canvas>

    </div>


    <!-- =========================
         BUTTON
    ========================== -->

    <button id="spinButton">
      ✨ SPIN THE WHEEL ✨
    </button>


    <!-- =========================
         RESULT
    ========================== -->

    <div class="result-box">

      <div class="result-label">
        Your Game Is...
      </div>

      <div id="result">
        Ready?
      </div>

    </div>


    <div class="footer">
      💗 LET THE GAMES BEGIN 💗
    </div>

  </div>


<script>

  /* ==========================================
     GAME OPTIONS
  ========================================== */

  const games = [
    "Who Knows Me Best",
    "Would I Rather",
    "Custom Board Game",
    "UNO",
    "TV Show Trivia",
    "Do or Drink",
    "Put a Finger Down",
    "Intoxicated"
  ];


  /* ==========================================
     WHEEL COLORS
  ========================================== */

  const colors = [
    "#ff4fa3",
    "#000000",
    "#ff78b9",
    "#111111",
    "#ff4fa3",
    "#000000",
    "#ff78b9",
    "#111111"
  ];


  /* ==========================================
     CANVAS SETUP
  ========================================== */

  const canvas = document.getElementById("wheel");
  const ctx = canvas.getContext("2d");

  const spinButton = document.getElementById("spinButton");
  const result = document.getElementById("result");

  const centerX = canvas.width / 2;
  const centerY = canvas.height / 2;

  const radius = canvas.width / 2 - 8;

  const sliceAngle = (2 * Math.PI) / games.length;


  /* ==========================================
     DRAW THE WHEEL
  ========================================== */

  function drawWheel(rotation = 0) {

    ctx.clearRect(0, 0, canvas.width, canvas.height);

    for (let i = 0; i < games.length; i++) {

      const startAngle =
        rotation + i * sliceAngle;

      const endAngle =
        startAngle + sliceAngle;


      /* Slice */

      ctx.beginPath();

      ctx.moveTo(centerX, centerY);

      ctx.arc(
        centerX,
        centerY,
        radius,
        startAngle,
        endAngle
      );

      ctx.closePath();

      ctx.fillStyle = colors[i];

      ctx.fill();


      /* Slice border */

      ctx.strokeStyle = "#ffffff";
      ctx.lineWidth = 3;

      ctx.stroke();


      /* Text */

      ctx.save();

      ctx.translate(centerX, centerY);

      ctx.rotate(
        startAngle + sliceAngle / 2
      );

      ctx.textAlign = "right";
      ctx.textBaseline = "middle";

      ctx.fillStyle = "#ffffff";

      ctx.font =
        "bold 17px Arial";

      /* Split longer titles */

      const words =
        games[i].split(" ");

      let lines = [];
      let currentLine = "";

      words.forEach(word => {

        const testLine =
          currentLine + " " + word;

        if (
          ctx.measureText(testLine).width >
          radius * 0.55
        ) {

          lines.push(currentLine.trim());

          currentLine = word;

        } else {

          currentLine = testLine;

        }

      });

      if (currentLine) {
        lines.push(currentLine.trim());
      }


      const lineHeight = 21;

      lines.forEach((line, index) => {

        ctx.fillText(
          line,
          radius - 20,
          (index -
            (lines.length - 1) / 2) *
            lineHeight
        );

      });

      ctx.restore();

    }


    /* Center circle */

    ctx.beginPath();

    ctx.arc(
      centerX,
      centerY,
      50,
      0,
      Math.PI * 2
    );

    ctx.fillStyle = "#000";
    ctx.fill();

    ctx.strokeStyle = "#ff4fa3";
    ctx.lineWidth = 6;
    ctx.stroke();


    /* Center decoration */

    ctx.fillStyle = "#ff4fa3";

    ctx.font = "bold 20px Arial";

    ctx.textAlign = "center";
    ctx.textBaseline = "middle";

    ctx.fillText(
      "25",
      centerX,
      centerY
    );

  }


  /* ==========================================
     SPIN LOGIC
  ========================================== */

  let currentRotation = 0;

  let spinning = false;


  spinButton.addEventListener("click", () => {

    if (spinning) return;

    spinning = true;

    spinButton.disabled = true;

    result.textContent = "Spinning...";


    /*
      Pick a random winning game
    */

    const winningIndex =
      Math.floor(
        Math.random() * games.length
      );


    /*
      We want the selected slice to
      finish underneath the pointer.

      The pointer is at the top
      (-90 degrees).
    */

    const targetAngle =
      -Math.PI / 2
      -
      (
        winningIndex * sliceAngle
        +
        sliceAngle / 2
      );


    /*
      Add several full rotations
      for a dramatic spin.
    */

    const extraSpins =
      5 + Math.floor(Math.random() * 3);


    const finalRotation =
      currentRotation
      +
      extraSpins * Math.PI * 2
      +
      normalizeAngle(
        targetAngle - currentRotation
      );


    const startRotation =
      currentRotation;


    const rotationDifference =
      finalRotation - startRotation;


    const duration = 5000;

    const startTime =
      performance.now();


    function animate(currentTime) {

      const elapsed =
        currentTime - startTime;

      const progress =
        Math.min(elapsed / duration, 1);


      /*
        Ease-out animation.
        Starts fast and gradually slows down.
      */

      const eased =
        1 - Math.pow(1 - progress, 4);


      currentRotation =
        startRotation
        +
        rotationDifference * eased;


      drawWheel(currentRotation);


      if (progress < 1) {

        requestAnimationFrame(animate);

      } else {

        currentRotation =
          finalRotation;

        drawWheel(currentRotation);

        result.textContent =
          games[winningIndex];

        spinning = false;

        spinButton.disabled = false;

      }

    }


    requestAnimationFrame(animate);

  });


  /* ==========================================
     NORMALIZE ANGLE
  ========================================== */

  function normalizeAngle(angle) {

    return (
      (angle + Math.PI * 2)
      %
      (Math.PI * 2)
    );

  }


  /* ==========================================
     INITIAL DRAW
  ========================================== */

  drawWheel();

</script>

</body>
</html>
